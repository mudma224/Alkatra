name: CI — ML Inference Service

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/ml-inference-service/**'
      - 'apps/spark-jobs/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/ml-inference-service/**'
      - 'apps/spark-jobs/**'

jobs:
  test-ml:
    name: Test ML + Spark (Feature Engineering)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ML deps
        working-directory: apps/ml-inference-service
        run: pip install -r requirements.txt pytest pytest-asyncio httpx pytest-cov

      - name: Run ML tests (mode DEMO — pas de modèles en CI)
        working-directory: apps/ml-inference-service
        run: pytest tests/ -v --cov=app --cov-report=xml
        env:
          ENVIRONMENT: test
          MLFLOW_TRACKING_URI: http://localhost:5000  # Non dispo en CI → mode DEMO

      - name: Install Spark deps
        working-directory: apps/spark-jobs
        run: pip install -r requirements.txt pytest

      - name: Test feature engineering (fonctions pures, sans Spark)
        working-directory: apps/spark-jobs
        run: pytest tests/ -v -k "not spark"

      - name: Lint Python (ruff)
        run: |
          pip install ruff
          ruff check apps/ml-inference-service/app/ apps/spark-jobs/jobs/