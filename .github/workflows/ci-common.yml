name: CI — Common (Lint + Typecheck + Build)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Lint all TypeScript
        run: npm run lint

      - name: Format check
        run: npx prettier --check "**/*.{ts,js,json}"

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Build iot-service
        run: docker build apps/iot-service --target development -t alkatra-iot:ci

      - name: Build spark-jobs
        run: docker build apps/spark-jobs -t alkatra-spark:ci
        continue-on-error: true   # Spark peut être lent à builder en CI

      - name: Build ml-inference-service
        run: docker build apps/ml-inference-service -t alkatra-ml:ci
        continue-on-error: true   # Modèles non disponibles en CI

  validate-k8s-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
       - uses: actions/checkout@v4

       - name: Install kubeconform
         run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
          | tar xz
          sudo mv kubeconform /usr/local/bin/

       - name: Validate manifests
         run: |
          kubeconform -strict -summary infra/kubernetes/