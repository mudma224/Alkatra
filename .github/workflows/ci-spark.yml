name: CI — Spark Jobs (Feature Engineering)

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/spark-jobs/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/spark-jobs/**'

jobs:
  test-spark-feature-engineering:
    name: Test Feature Engineering (sans Spark)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/spark-jobs/requirements.txt

      - name: Install Python dependencies
        working-directory: apps/spark-jobs
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Test fonctions pures (sans Spark cluster)
        working-directory: apps/spark-jobs
        run: pytest tests/ -v --cov=jobs -k "not spark and not kafka"
        env:
          PYTHONPATH: .
          KAFKA_BROKERS: localhost:9092         # Non disponible en CI — tests mocked
          OPEN_METEO_BASE_URL: https://api.open-meteo.com/v1

      - name: Lint Python avec ruff
        run: |
          pip install ruff
          ruff check apps/spark-jobs/jobs/ --ignore E501 || true
          # E501 (line too long) ignore — les calculs ETo/Penman-Monteith sont verbeux

  validate-docker-build:
    name: Validate Spark Docker Build
    runs-on: ubuntu-latest
    needs: test-spark-feature-engineering

    steps:
      - uses: actions/checkout@v4

      - name: Build Spark image
        run: docker build apps/spark-jobs -t alkatra-spark:ci
        timeout-minutes: 15
        # Le build Spark est lourd — timeout 15 min

      - name: Verify image starts
        run: |
          docker run --rm --name spark-test -d alkatra-spark:ci sleep 30
          sleep 5
          docker ps | grep spark-test
          docker stop spark-test
        continue-on-error: true
        # Le container peut terminer immediatement si le job Python n'existe pas encore