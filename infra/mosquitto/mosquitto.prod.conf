# Mosquitto — Production (TLS + authentification)
# Requis CdC Section 6.3 : "broker sécurisé (TLS + authentication par certificat)"

listener 8883
protocol mqtt

# TLS
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
tls_version tlsv1.3
require_certificate true    # Certificat client obligatoire par device ESP32

listener 9010
protocol websockets
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

allow_anonymous false
password_file /mosquitto/config/passwd

log_dest file /mosquitto/log/mosquitto.log
log_type error,warning,notice,information

persistence true
persistence_location /mosquitto/data/

max_connections 10000
max_inflight_messages 100
max_qos 2