# Docker Compose v2 — pas de directive "version:" (dépréciée)
# Al Katra Bel Qatra — Stack de développement complète

networks:
  alkatra-net:
    driver: bridge
    name: alkatra-net

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
  mosquitto_data:
  grafana_data:
  prometheus_data:
  mlflow_data:
  keycloak_data:

services:

  # ==========================================
  # POSTGRESQL — Base de données principale
  # ==========================================
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: alkatra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alkatra_postgres_pass}
      POSTGRES_DB: ${POSTGRES_DB:-alkatra_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - alkatra-net

  # ==========================================
  # MONGODB — Données IoT time-series
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: alkatra-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-alkatra}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-123}
      MONGO_INITDB_DATABASE: alkatra_iot
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - alkatra-net

  # ==========================================
  # REDIS — Cache + Sessions
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: alkatra-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-alkatra_redis_pass}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-alkatra_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alkatra-net

# ==========================================
  # KAFKA — KRaft mode (Apache officiel 3.7.0)
  # ==========================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: alkatra-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CLUSTER_ID: "MkQkTkRETkDTkT"

      # Listeners — une seule ligne, pas de > YAML
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # Single node
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    networks:
      - alkatra-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: alkatra-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: alkatra
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    networks:
      - alkatra-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s


  # ==========================================
  # MAILHOG — Email dev (OTP test Phase 1)
  # ==========================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: alkatra-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - alkatra-net

# ==========================================
  # MOSQUITTO — MQTT Broker
  # ==========================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: alkatra-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./../../infra/mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - alkatra-net

# ==========================================
  # MLFLOW — Model Registry + Tracking
  # Build custom : image officielle + psycopg2 (requis pour PostgreSQL backend)
  # ==========================================
  mlflow:
    build:
      context: ../../infra/mlflow
      dockerfile: Dockerfile
    container_name: alkatra-mlflow
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - mlflow_data:/mlruns
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alkatra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: ${POSTGRES_DB:-alkatra_db}
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5).getcode()==200 else sys.exit(1)\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - alkatra-net

  # ==========================================
  # KEYCLOAK — Auth OIDC (Phase 1 placeholder)
  # Requis CdC Section 6.4.1 — NestJS + Keycloak
  # Container prêt dès M0, configuré en Phase 1 S1-S2
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: alkatra-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-alkatra_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-alkatra}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-123}
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-123}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alkatra-net
    profiles:
      - auth   # Démarré via: docker compose --profile auth up

  # ==========================================
  # PROMETHEUS — Métriques
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: alkatra-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./../../infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - alkatra-net

  # ==========================================
  # GRAFANA — Dashboards
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: alkatra-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-342742868Gabaski224}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./../../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./../../infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - alkatra-net


  # ==========================================
  # iot-service
  # ==========================================
  iot-service:
    build:
      context: ./../../apps/iot-service
      dockerfile: Dockerfile
      target: development
    container_name: alkatra-iot
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3005
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      KAFKA_BROKERS: kafka:9092
      MONGODB_URI: mongodb://${MONGO_USER:-alkatra}:${MONGO_PASSWORD:-123}@mongodb:27017/alkatra_iot?authSource=admin
    ports:
      - "3005:3005"
    volumes:
      - ./../../apps/iot-service/src:/app/src
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3005/api/v1/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
     - alkatra-net
