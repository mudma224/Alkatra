apiVersion: v1
kind: ConfigMap
metadata:
  name: alkatra-config
  namespace: alkatra
data:
  NODE_ENV: "production"
  KAFKA_BROKERS: "kafka-service:9092"
  MQTT_BROKER_URL: "mqtt://mosquitto-service:1883"
  MLFLOW_TRACKING_URI: "http://mlflow-service:5000"
  LOG_LEVEL: "INFO"
  OPEN_METEO_BASE_URL: "https://api.open-meteo.com/v1"