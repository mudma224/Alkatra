# NE PAS COMMITTER ce fichier avec de vraies valeurs !
# En production : utiliser Vault ou kubectl create secret
# Template uniquement — remplacer les <VALUE> par des valeurs base64
apiVersion: v1
kind: Secret
metadata:
  name: alkatra-secrets
  namespace: alkatra
type: Opaque
data:
  POSTGRES_PASSWORD: <base64_value>
  MONGO_PASSWORD: <base64_value>
  REDIS_PASSWORD: <base64_value>
  JWT_SECRET: <base64_value>
  JWT_REFRESH_SECRET: <base64_value>
  INFOBIP_API_KEY: <base64_value>
  MQTT_PASSWORD: <base64_value>
  GRAFANA_PASSWORD: <base64_value>