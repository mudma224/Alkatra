apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-inference-service
  namespace: alkatra
  labels:
    app: ml-inference-service
    component: ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-inference-service
  template:
    metadata:
      labels:
        app: ml-inference-service
    spec:
      containers:
        - name: ml-inference
          image: alkatra/ml-inference-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: alkatra-config
            - secretRef:
                name: alkatra-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ml-inference-service
  namespace: alkatra
spec:
  selector:
    app: ml-inference-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP