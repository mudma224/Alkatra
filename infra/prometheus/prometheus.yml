global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development
    project: alkatra

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'iot-service'
    static_configs:
      - targets: ['iot-service:3005']
    metrics_path: /metrics

  - job_name: 'ml-inference-service'
    static_configs:
      - targets: ['ml-inference-service:8000']
    metrics_path: /metrics

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']

  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']
    metrics_path: /metrics

  # Phase 1 — décommenter quand auth-service actif
  # - job_name: 'auth-service'
  #   static_configs:
  #     - targets: ['auth-service:3001']
  #   metrics_path: /metrics