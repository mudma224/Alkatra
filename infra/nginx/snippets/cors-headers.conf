# =============================================================================
# Al Katra Bel Qatra - CORS + security headers (included in every API location)
# =============================================================================
# The browser only ever talks to the GATEWAY, so CORS must be applied here on
# ALL responses (preflight AND real responses).
#
# SECURITY:
#  - Allowed origins come from the `$cors_origin` map in nginx.conf.template.
#    We NEVER use `$http_origin` directly (origin reflection = CORS hole).
#  - If the origin is not allowlisted, no CORS header is emitted at all, so the
#    browser refuses the response. No data leaks to unauthorized origins.
#  - A location that defines its own `add_header` does NOT inherit the
#    server-level `add_header` directives, so the OWASP security headers are
#    redeclared here (otherwise this change would silently weaken them).
# =============================================================================

# --- OWASP security headers (redeclared, see above) ---
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# --- Strip any CORS headers coming from backends (single source of truth) ---
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Allow-Credentials;

# --- CORS: added to EVERY response (including proxied ones) ---
# `$cors_origin` is empty when the origin is not allowed -> no CORS header.
if ($cors_origin) {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
}
add_header Vary Origin always;

# --- OPTIONS preflight: answered directly by the gateway (204), never proxied ---
if ($request_method = 'OPTIONS') {
    if ($cors_origin) {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;
    }
    return 204;
}
