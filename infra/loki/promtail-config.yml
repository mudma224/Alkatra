# Promtail — découverte des conteneurs Docker via le socket, envoi vers Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Étiquette `container` = nom du conteneur (sans le slash initial).
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      # Étiquette `image` = nom de l'image.
      - source_labels: [__meta_docker_container_image]
        regex: (.*)
        target_label: image
      # Ne pas ingérer les logs de l'observabilité elle-même.
      - source_labels: [container]
        regex: alkatra-(loki|promtail)
        action: drop
    pipeline_stages:
      - docker: {}
