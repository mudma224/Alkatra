apiVersion: 1
# Provider Al Katra — l'arborescence de dossiers du repo devient la
# structure de dossiers Grafana (foldersFromFilesStructure). Un nouveau
# domaine = un nouveau sous-dossier dans infra/grafana/dashboards/.
providers:
  - name: 'Al Katra'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
