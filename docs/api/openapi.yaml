    AssociateSensorRequest:
      type: object
      required: [deviceId, parcelId]
      properties:
        deviceId:
          type: string
          description: >-
            Identifiant physique du capteur (device_id ESP32, ex.
            "esp32-sim-001") — correspond à la colonne deviceId de
            sensor.entity.ts, pas à l'UUID technique interne de la table sensors.
          example: "esp32-sim-001"
        parcelId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"

    SensorAssociation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        deviceId:
          type: string
          example: "esp32-sim-001"
        parcelId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        deviceType:
          type: string
          example: "esp32-wroom-32"
        healthStatus:
          type: string
          enum: [pending, active, inactive, failing]
          example: active
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        batteryPct:
          type: integer
          nullable: true
          example: 87
        firmwareVersion:
          type: string
          nullable: true
          example: "1.0.4"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Sensor:
      type: object
      description: >-
        Entité capteur telle que sérialisée par le farm-service. Le statut
        d'affichage est porté par healthStatus : pending, active, inactive ou
        failing. Un heartbeat récent ramène le statut à active.
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        parcelId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        deviceId:
          type: string
          example: "esp32-sim-001"
        deviceType:
          type: string
          example: "esp32-wroom-32"
        healthStatus:
          type: string
          enum: [pending, active, inactive, failing]
          example: active
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        batteryPct:
          type: integer
          nullable: true
          example: 87
        firmwareVersion:
          type: string
          nullable: true
          example: "1.0.4"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time